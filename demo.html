<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webflow Globe Widget Demo</title>
  <link rel="stylesheet" href="globe-widget.css?v=dismiss-mobile-search-keyboard">
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(123, 224, 255, 0.12), transparent 22%),
        radial-gradient(circle at 80% 12%, rgba(104, 167, 255, 0.18), transparent 18%),
        linear-gradient(180deg, #04131f, #0c3147);
    }
  </style>
</head>
<body>
  <div class="wf-globe-widget" data-globe-widget>
    <div class="wf-globe-widget__frame">
      <canvas class="wf-globe-widget__canvas" data-globe-canvas aria-label="Interactive rotating globe"></canvas>

      <form class="wf-globe-widget__search" data-country-search-form role="search" autocomplete="off">
        <input class="wf-globe-widget__input" data-country-search-input type="text" placeholder="Search countries" aria-label="Search countries" role="combobox" aria-autocomplete="list" aria-controls="countrySuggestions" aria-expanded="false" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false">
        <button class="wf-globe-widget__search-clear" data-country-search-clear type="button" aria-label="Clear search" hidden>
          <span class="wf-globe-widget__search-clear-icon" aria-hidden="true"></span>
        </button>
        <div class="wf-globe-widget__suggestions" data-country-suggestions role="listbox" aria-label="Country suggestions" hidden></div>
      </form>

      <div class="wf-globe-widget__zoom" aria-label="Zoom controls">
        <button class="wf-globe-widget__zoom-button" data-zoom-in type="button" aria-label="Zoom in">+</button>
        <button class="wf-globe-widget__zoom-button" data-zoom-out type="button" aria-label="Zoom out">–</button>
      </div>

      <div class="wf-globe-widget__hud">
        <span class="wf-globe-widget__hud-spacer" aria-hidden="true"></span>
        <span class="wf-globe-widget__label" data-country-label aria-live="polite">Select a country</span>
        <button class="wf-globe-widget__hud-clear" data-clear-selection type="button" aria-label="Deselect country" hidden>
          <span class="wf-globe-widget__hud-clear-icon" aria-hidden="true"></span>
        </button>
      </div>

      <p class="wf-globe-widget__status" data-globe-status role="alert" hidden></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    window.WORLD_TOPOLOGY_URL = "countries-50m.json?v=tier-matched-fills";
    window.WORLD_TOPOLOGY_OVERVIEW_URL = "countries-50m-overview.json?v=tier-matched-fills";
    window.WORLD_TOPOLOGY_CLOSE_DETAIL_URL = "countries-50m-close.json?v=close-high-detail";
  </script>
  <script src="globe-widget.js?v=dismiss-mobile-search-keyboard"></script>
</body>
</html>
